spring.application.name=${APPLICATION_NAME:bloghorizon}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${DATABASE_NAME}
server.forward-headers-strategy=framework
server.tomcat.accept-invalid-host-header=true
spring.profiles.active=dev
app.cors.allowed-origins=${ALLOWED_ORIGINS}
auth0.domain=${AUTH0_DOMAIN}
auth0.client-id=${AUTH0_CLIENT_ID}
auth0.client-secret=${AUTH0_CLIENT_SECRET}
auth0.audience=${AUTH0_AUDIENCE}
spring.config.import=optional:env[.env]